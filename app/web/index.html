<!DOCTYPE html>
<html lang="es-MX">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="Inventario del Laboratorio Maker">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Inventario Maker">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <meta name="theme-color" content="#16211F">

  <!-- Icono de la pestaña: el SVG es el cubo solo, que se lee bien abajo de 32 px.
       El PNG queda de respaldo para navegadores que no aceptan SVG. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png"/>

  <style>
    /* Mientras carga la app: fondo e icono, para que no se vea una pantalla en blanco. */
    html, body { margin: 0; height: 100%; background: #16211F; }
    #cargando { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
                justify-content: center; gap: 18px; font-family: system-ui, sans-serif; color: #F2EEE6; }
    #cargando img { width: 96px; height: 96px; }
    #cargando p { margin: 0; font-size: 15px; letter-spacing: .04em; opacity: .85; }
    #cargando .barra { width: 140px; height: 3px; background: rgba(242,238,230,.25); overflow: hidden; border-radius: 2px; }
    #cargando .barra i { display: block; width: 40%; height: 100%; background: #C4571F; animation: vaiven 1.1s infinite ease-in-out; }
    @keyframes vaiven { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
  </style>
  <title>Inventario Maker</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="cargando">
    <img src="icons/Icon-192.png" alt="">
    <p>Cargando el inventario…</p>
    <div class="barra"><i></i></div>
  </div>
  <script>
    // Se quita en cuanto la app dibuja su primera pantalla.
    window.addEventListener('flutter-first-frame', () => document.getElementById('cargando')?.remove());
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
